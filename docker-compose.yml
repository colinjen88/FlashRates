version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: goldlab-cloud-backend
    restart: always
    environment:
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    networks:
      - default
    depends_on:
      - redis

  frontend:
    image: nginx:alpine
    container_name: goldlab-cloud-frontend
    restart: always
    labels:
      caddy: http://goldlab.cloud
      caddy.reverse_proxy: "{{upstreams 80}}"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "9000:80"
    networks:
      - default
      - web-proxy
    depends_on:
      - backend

  redis:
    image: redis:alpine
    container_name: goldlab-cloud-redis
    restart: always
    networks:
      - default

networks:
  web-proxy:
    external: true
  default:
    driver: bridge
