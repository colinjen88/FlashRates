version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: goldlab-cloud-backend
    restart: always
    environment:
      - REDIS_HOST=redis
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - default
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8000/api/v1/latest" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: nginx:alpine
    container_name: goldlab-cloud-frontend
    restart: always
    labels:
      caddy: http://goldlab.cloud
      caddy.reverse_proxy: "{{upstreams 80}}"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "9000:80"
    networks:
      - default
      - web-proxy
    depends_on:
      - backend

  redis:
    image: redis:alpine
    container_name: goldlab-cloud-redis
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - default

networks:
  web-proxy:
    external: true
  default:
    driver: bridge
